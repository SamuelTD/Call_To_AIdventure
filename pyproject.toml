[project]
name = "call-to-aidventure"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.3.0",
    "django>=5.2.7",
    "django-prometheus>=2.5.0",
    "dotenv>=0.9.9",
    "gunicorn>=26.2.0",
    "langchain>=1.0.3",
    "langchain-chroma>=1.0.0",
    "langchain-community>=0.4.1",
    "langchain-core>=1.0.2",
    "langchain-ollama>=1.0.0",
    "langchain-openai>=1.6.0",
    "langgraph>=1.0.2",
    "ruff>=0.14.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
exclude = ["src/agents/game_master_graph_legacy.py", "src/ui/gradio_legacy.py"]

[tool.coverage.run]
source = ["agents", "retrieval", "observability", "game"]
omit = ["*/migrations/*", "*legacy.py"]

[tool.coverage.report]
fail_under = 55
skip_covered = true
show_missing = true

[dependency-groups]
dev = [
    "coverage>=7.15.4",
]
