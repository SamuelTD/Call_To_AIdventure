<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Victory - Call To AIdventure</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: #eee;
        }

        .page {
            max-width: 820px;
            margin: 80px auto;
            padding: 24px;
        }

        .panel {
            background: #1c1c1c;
            border: 1px solid #2f3a25;
            border-radius: 10px;
            padding: 28px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
            text-align: center;
        }

        h1 {
            margin-top: 0;
            font-size: 2.2rem;
            color: #b7f58a;
        }

        .outro {
            line-height: 1.6;
            color: #ddd;
            text-align: left;
            white-space: pre-wrap;
        }

        a {
            display: inline-block;
            margin-top: 24px;
            padding: 12px 18px;
            border-radius: 8px;
            background: #6d4aff;
            color: white;
            font-weight: bold;
            text-decoration: none;
        }

        a:hover {
            background: #5b3de0;
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="panel">
            <h1>{{ adventure_name }}</h1>
            <div class="outro">{{ outro }}</div>
            <a href="{% url 'landing' %}">Return to landing</a>
        </div>
    </div>
</body>
</html>
