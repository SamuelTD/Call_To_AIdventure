{% load i18n %}
{% get_current_language as LANGUAGE_CODE %}
<form action="{% url 'set_language' %}" method="post" class="language-toggle" aria-label="Language">
    {% csrf_token %}
    <input name="next" type="hidden" value="{{ request.get_full_path }}">
    <button name="language" value="en" type="submit"{% if LANGUAGE_CODE|slice:':2' == 'en' %} class="active" aria-current="true"{% endif %}>EN</button>
    <span aria-hidden="true">/</span>
    <button name="language" value="fr" type="submit"{% if LANGUAGE_CODE|slice:':2' == 'fr' %} class="active" aria-current="true"{% endif %}>FR</button>
</form>
<style>
    .language-toggle { position: fixed; top: 12px; right: 12px; z-index: 1000; display: flex; gap: 5px; align-items: center; padding: 6px 8px; border: 1px solid #444; border-radius: 8px; background: #181818; color: #888; }
    .language-toggle button { width: auto; min-width: 0; margin: 0; padding: 2px 4px; border: 0; background: transparent; color: #aaa; font: inherit; cursor: pointer; }
    .language-toggle button.active { color: #fff; font-weight: bold; text-decoration: underline; text-underline-offset: 3px; }
</style>
