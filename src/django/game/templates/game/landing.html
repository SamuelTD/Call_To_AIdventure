<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Call To AIdventure</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: #eee;
        }

        .page {
            max-width: 1000px;
            margin: 40px auto;
            padding: 24px;
        }

        .panel {
            background: #1c1c1c;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
        }

        h1 {
            margin-top: 0;
            font-size: 2rem;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .account-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: flex-end;
            color: #bbb;
            font-size: 0.95rem;
        }

        .account-link, .logout-button {
            width: auto;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #252525;
            color: #eee;
            font-size: 0.95rem;
            font-weight: bold;
            text-decoration: none;
            line-height: 1.2;
        }

        .logout-form {
            margin: 0;
        }

        .logout-button {
            cursor: pointer;
        }

        @media (max-width: 640px) {
            .top-bar {
                display: block;
            }

            .account-actions {
                justify-content: flex-start;
                margin-top: 12px;
            }
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        select, button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            font-size: 1rem;
            box-sizing: border-box;
        }

        select {
            background: #222;
            color: #eee;
            margin-bottom: 20px;
        }

        button {
            background: #6d4aff;
            color: white;
            cursor: pointer;
            border: none;
            font-weight: bold;
        }

        button:hover {
            background: #5b3de0;
        }

        .hidden {
            display: none;
        }

        .intro-box {
            margin-top: 20px;
            min-height: 140px;
            white-space: pre-wrap;
            line-height: 1.5;
            background: #151515;
            border: 1px solid #2f2f2f;
            border-radius: 8px;
            padding: 16px;
        }

        .status {
            margin-top: 12px;
            color: #bbb;
            font-size: 0.95rem;
        }

        .error {
            color: #ff7b7b;
        }

        .section-title {
            margin: 24px 0 12px;
            font-size: 1.25rem;
        }

        .saved-games {
            display: grid;
            gap: 12px;
            margin-bottom: 24px;
        }

        .save-card {
            background: #151515;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 14px;
        }

        .save-card h3 {
            margin: 0 0 8px;
            font-size: 1.05rem;
        }

        .save-meta, .save-preview {
            color: #bbb;
            font-size: 0.92rem;
            line-height: 1.4;
        }

        .save-preview {
            margin-top: 8px;
        }

        .save-actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .save-actions button {
            width: auto;
            padding: 9px 12px;
            font-size: 0.95rem;
        }

        .delete-save-btn {
            background: #3a2525;
            border: 1px solid #623535;
        }

        .delete-save-btn:hover {
            background: #4a2b2b;
        }

        .empty-saves {
            color: #bbb;
            margin-bottom: 24px;
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="panel">
            <div class="top-bar">
                <h1>🎲 Call To AIdventure</h1>

                <div class="account-actions">
                    {% if user.is_authenticated %}
                        <span>{{ user.username }}</span>
                        <form class="logout-form" method="post" action="{% url 'logout' %}">
                            {% csrf_token %}
                            <button class="logout-button" type="submit">Log Out</button>
                        </form>
                    {% else %}
                        <a class="account-link" href="{% url 'login' %}">Log In</a>
                        <a class="account-link" href="{% url 'signup' %}">Create Account</a>
                    {% endif %}
                </div>
            </div>

            {% if user.is_authenticated %}
                <h2 class="section-title">Continue Adventure</h2>
                <div id="saved-games" class="saved-games"></div>
                <div id="saved-games-empty" class="empty-saves hidden">No saved games yet.</div>
            {% endif %}

            <h2 class="section-title">Start New Adventure</h2>
            <label for="adventure-select">Choose an adventure</label>
            <select id="adventure-select">
                <option value="">Loading adventures...</option>
            </select>

            <div id="intro-box" class="intro-box">
                Select an adventure to see its introduction.
            </div>

            <div id="status" class="status"></div>

            <button id="start-btn" class="hidden">Start Adventure</button>
        </div>
    </div>

    <script>
        const API_ADVENTURES_URL = "{% url 'api_adventures' %}";
        const API_START_URL = "{% url 'api_start' %}";
        const IS_AUTHENTICATED = {{ user.is_authenticated|yesno:"true,false" }};
        const API_SAVES_URL = "{% url 'api_saves' %}";
        const API_SAVE_LOAD_TEMPLATE = "{% url 'api_save_load' 0 %}";
        const API_SAVE_DELETE_TEMPLATE = "{% url 'api_save_delete' 0 %}";

        const adventureSelect = document.getElementById("adventure-select");
        const introBox = document.getElementById("intro-box");
        const startBtn = document.getElementById("start-btn");
        const statusBox = document.getElementById("status");
        const savedGames = document.getElementById("saved-games");
        const savedGamesEmpty = document.getElementById("saved-games-empty");

        let adventures = [];

        function saveUrl(template, id) {
            return template.replace("/0/", `/${id}/`);
        }

        function formatSaveDate(value) {
            if (!value) return "";
            return new Intl.DateTimeFormat(undefined, {
                dateStyle: "medium",
                timeStyle: "short"
            }).format(new Date(value));
        }

        function renderSaves(saves) {
            if (!savedGames || !savedGamesEmpty) return;

            savedGames.innerHTML = "";

            if (!saves || saves.length === 0) {
                savedGamesEmpty.classList.remove("hidden");
                return;
            }

            savedGamesEmpty.classList.add("hidden");

            for (const save of saves) {
                const card = document.createElement("article");
                card.className = "save-card";

                const title = document.createElement("h3");
                title.textContent = save.adventure_name || "Adventure";

                const meta = document.createElement("div");
                meta.className = "save-meta";
                const hp = save.player_hp == null ? "" : ` · HP ${save.player_hp}/${save.player_max_hp}`;
                meta.textContent = `${save.player_name || "Adventurer"}${hp} · Updated ${formatSaveDate(save.updated_at)}`;

                const preview = document.createElement("div");
                preview.className = "save-preview";
                preview.textContent = save.story_preview || "The adventure has just begun.";

                const actions = document.createElement("div");
                actions.className = "save-actions";

                const continueBtn = document.createElement("button");
                continueBtn.type = "button";
                continueBtn.textContent = "Continue";
                continueBtn.addEventListener("click", () => loadSave(save.id));

                const deleteBtn = document.createElement("button");
                deleteBtn.type = "button";
                deleteBtn.className = "delete-save-btn";
                deleteBtn.textContent = "Delete";
                deleteBtn.addEventListener("click", () => deleteSave(save.id));

                actions.appendChild(continueBtn);
                actions.appendChild(deleteBtn);
                card.appendChild(title);
                card.appendChild(meta);
                card.appendChild(preview);
                card.appendChild(actions);
                savedGames.appendChild(card);
            }
        }

        async function loadSaves() {
            if (!IS_AUTHENTICATED) return;

            try {
                const response = await fetch(API_SAVES_URL);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Failed to load saved games");
                }

                renderSaves(data.saves || []);
            } catch (err) {
                console.error(err);
                statusBox.textContent = err.message;
                statusBox.classList.add("error");
            }
        }

        async function loadSave(id) {
            statusBox.classList.remove("error");
            statusBox.textContent = "Loading saved game...";

            try {
                const response = await fetch(saveUrl(API_SAVE_LOAD_TEMPLATE, id), {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    }
                });
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Failed to load saved game");
                }

                window.location.href = data.redirect_url || "/play/";
            } catch (err) {
                console.error(err);
                statusBox.textContent = err.message;
                statusBox.classList.add("error");
            }
        }

        async function deleteSave(id) {
            statusBox.classList.remove("error");
            statusBox.textContent = "Deleting saved game...";

            try {
                const response = await fetch(saveUrl(API_SAVE_DELETE_TEMPLATE, id), {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    }
                });
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Failed to delete saved game");
                }

                statusBox.textContent = "";
                await loadSaves();
            } catch (err) {
                console.error(err);
                statusBox.textContent = err.message;
                statusBox.classList.add("error");
            }
        }

        async function loadAdventures() {
            statusBox.textContent = "Loading adventures...";

            try {
                const response = await fetch(API_ADVENTURES_URL);
                const data = await response.json();

                adventures = data.adventures || [];

                adventureSelect.innerHTML = '<option value="">-- Select an adventure --</option>';

                for (const adv of adventures) {
                    const option = document.createElement("option");
                    option.value = adv.id;
                    option.textContent = adv.name;
                    adventureSelect.appendChild(option);
                }

                statusBox.textContent = "";
            } catch (err) {
                console.error(err);
                statusBox.textContent = "Failed to load adventures.";
                statusBox.classList.add("error");
            }
        }

        adventureSelect.addEventListener("change", () => {
            const selectedId = adventureSelect.value;
            const adv = adventures.find(a => a.id === selectedId);

            if (!adv) {
                introBox.textContent = "Select an adventure to see its introduction.";
                startBtn.classList.add("hidden");
                return;
            }

            introBox.textContent = adv.description || "No description available.";
            startBtn.classList.remove("hidden");
        });

        startBtn.addEventListener("click", async () => {
            const selectedId = adventureSelect.value;

            if (!selectedId) return;

            startBtn.disabled = true;
            statusBox.textContent = "Starting adventure...";

            try {
                const response = await fetch(API_START_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        adventure_id: selectedId
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Failed to start adventure");
                }

                window.location.href = "/play/";
            } catch (err) {
                console.error(err);
                statusBox.textContent = err.message;
                statusBox.classList.add("error");
                startBtn.disabled = false;
            }
        });

        loadAdventures();
        loadSaves();
    </script>
</body>
</html>
