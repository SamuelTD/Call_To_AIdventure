<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log In - Call To AIdventure</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: #111;
            color: #eee;
        }

        .auth-panel {
            width: min(420px, calc(100vw - 32px));
            background: #1c1c1c;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
        }

        h1 {
            margin: 0 0 20px;
            font-size: 1.8rem;
        }

        label {
            display: block;
            margin: 14px 0 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #222;
            color: #eee;
            font-size: 1rem;
            box-sizing: border-box;
        }

        button, .secondary-link {
            display: block;
            width: 100%;
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            border: 0;
            box-sizing: border-box;
            text-align: center;
            font-size: 1rem;
            font-weight: bold;
            text-decoration: none;
        }

        button {
            background: #6d4aff;
            color: white;
            cursor: pointer;
        }

        .secondary-link {
            background: #262626;
            color: #eee;
            border: 1px solid #3a3a3a;
        }

        .errorlist, .form-error {
            color: #ff8b8b;
        }
    </style>
</head>
<body>
    <main class="auth-panel">
        <h1>Log In</h1>

        {% if form.non_field_errors %}
            <div class="form-error">{{ form.non_field_errors }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <label for="{{ form.username.id_for_label }}">Username</label>
            {{ form.username }}
            {{ form.username.errors }}

            <label for="{{ form.password.id_for_label }}">Password</label>
            {{ form.password }}
            {{ form.password.errors }}

            <button type="submit">Log In</button>
        </form>

        <a class="secondary-link" href="{% url 'signup' %}">Create Account</a>
        <a class="secondary-link" href="{% url 'landing' %}">Back to Adventures</a>
    </main>
</body>
</html>
